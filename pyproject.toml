[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "rtree"
authors = [
    {name = "Sean Gillies", email = "sean.gillies@gmail.com"},
]
maintainers = [
    {name = "Howard Butler", email = "howard@hobu.co"},
    {name = "Mike Taves", email = "mwtoews@gmail.com"},
]
description = "R-Tree spatial index for Python GIS"
readme = "README.md"
requires-python = ">=3.10"
# Id queries return NumPy arrays.
dependencies = ["numpy>=1.23"]
keywords = ["gis", "spatial", "index", "r-tree"]
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Database",
]
dynamic = ["version"]

[project.urls]
Documentation = "https://rtree.readthedocs.io"
Repository = "https://github.com/Toblerity/rtree"

[dependency-groups]
dev = [
    "coverage",
    "pre-commit",
    "tox>=4.22",
    {include-group = "tests"},
]
docs = [
    "sphinx>=5.0",
    "sphinx-issues",
]
tests = [
    "numpy",
    "pytest>=7.0",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["rtree"]
# rtree/_core.pyi is generated by scripts/generate_stubs.sh and committed.
sdist.include = ["rtree/_core.pyi"]
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "rtree/__init__.py"

[tool.cibuildwheel]
# A compiled extension needs one wheel per CPython minor version (the old
# ctypes wheels were retagged py3-none-<platform> by scripts/repair_wheel.py).
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
# No CPython 3.10 for Windows on ARM.
skip = "*-win32 *-manylinux_i686 *-musllinux_i686 cp310-win_arm64"
build-verbosity = 1
test-requires = "tox"
test-command = "tox --conf {project} --installpkg {wheel}"
test-skip = [
    "*-macosx_arm64",
]

[tool.cibuildwheel.linux]
archs = ["auto"]
before-all = [
    "yum install -y cmake || true",
    "sh {project}/scripts/install_libspatialindex.sh",
]

[[tool.cibuildwheel.overrides]]
select = "*-musllinux*"
before-all = [
    "apk add cmake",
    "sh {project}/scripts/install_libspatialindex.sh",
]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET="10.13" }
before-all = [
    "brew install cmake coreutils || true",
    "sh {project}/scripts/install_libspatialindex.sh",
]

[tool.cibuildwheel.windows]
archs = ["auto64"]
before-all = [
    "call {project}\\scripts\\install_libspatialindex.bat",
]

[tool.coverage.report]
# Ignore warnings for overloads
# https://github.com/nedbat/coveragepy/issues/970#issuecomment-612602180
exclude_lines = [
    "pragma: no cover",
    "@overload",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "I",   # isort
    "NPY",  # NumPy-specific
]

[tool.mypy]
exclude = ["docs", "build"]
ignore_missing_imports = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["rtree.index", "rtree._core"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
